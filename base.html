<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Responsive personal portfolio website built using Python Flask and semantic HTML5.">
<meta name="keywords" content="Portfolio, Python, Flask, HTML5, CSS3, Developer">
<meta name="author" content="Your Name">
<meta name="robots" content="index, follow">
<title>{% block title %}Portfolio{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header role="banner">
<h1>My Portfolio</h1>
<nav aria-label="Primary Navigation">
<ul style="list-style:none;display:flex;gap:15px;padding:0;">
<li><a href="/">Home</a></li>
<li><a href="/about">About</a></li>
<li><a href="/projects">Projects</a></li>
<li><a href="/contact">Contact</a></li>
</ul>
</nav>
</header>
<main id="main-content" tabindex="-1">
{% block content %}{% endblock %}
</main>
<footer role="contentinfo">
<p>&copy; 2026 My Portfolio. All Rights Reserved.</p>
</footer>
</body>
</html>
